services:
  - type: web
    name: boostbyrajat
    runtime: node
    # Free instances wipe the disk on every deploy. Starter can keep /var/data.
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: bbr-desk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: groq
      - key: VENDOR_LANG
        value: hi
      - key: GROQ_API_KEY
        sync: false
      - key: VENDOR_DESK_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        value: "918696666063"
      - key: VITE_WHATSAPP_NUMBER
        value: "918696666063"
      - key: PUBLIC_EMAIL
        value: rajatbissa16@gmail.com
      - key: PUBLIC_SITE_URL
        value: https://www.boostbyrajat.co.in
      - key: DATA_DIR
        value: /var/data
      - key: GITHUB_DATA_REPO
        value: BoostByRajat/bbr-desk-data
      - key: GITHUB_DATA_TOKEN
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: rajatbissa16@gmail.com
      - key: SMTP_FROM
        value: "BoostByRajat <rajatbissa16@gmail.com>"
      - key: SMTP_PASS
        sync: false
      - key: VITE_GA_MEASUREMENT_ID
        value: G-H65FJQ44E0
      - key: VITE_GSC_VERIFICATION
        value: QFW5XG3zc0n2irgNVCW5eMlRx6plJE1agwFd8XPGeU0
