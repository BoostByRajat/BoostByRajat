name: Keep Render Awake

on:
  schedule:
    # ~every 10 min (GitHub cron can drift a few minutes)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          set -e
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "https://boostbyrajat.onrender.com/api/health"; then
              echo
              echo "OK (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 15
          done
          echo "All attempts failed (service may be cold or down)"
          exit 0
